# Nginx Security Configuration
# Place this file in /etc/nginx/conf.d/security.conf
# Validated for Nginx 1.18+ / 1.24+ / 1.26+ in HTTP context

# Hide Nginx version banner
server_tokens off;

# Global Security Headers (always added)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://fonts.googleapis.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https:; connect-src 'self'; frame-ancestors 'self';" always;

# Buffer & Request Size Hardening (prevent buffer overflow and large payload DoS)
client_max_body_size 10M;
client_body_buffer_size 128k;
client_header_buffer_size 1k;
large_client_header_buffers 4 8k;

# Timeouts to mitigate Slowloris / slow client attacks
client_body_timeout 12;
client_header_timeout 12;
keepalive_timeout 30;
send_timeout 10;

# Connection & Rate Limiting Zones (Memory zones allocated in http context)
limit_conn_zone $binary_remote_addr zone=addr_limit:10m;
limit_req_zone $binary_remote_addr zone=req_limit:10m rate=15r/s;

# Gzip Compression Settings
gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_proxied any;
gzip_comp_level 6;
gzip_types
    text/plain
    text/css
    text/xml
    text/javascript
    application/json
    application/javascript
    application/x-javascript
    application/xml
    application/xml+rss
    image/svg+xml;
