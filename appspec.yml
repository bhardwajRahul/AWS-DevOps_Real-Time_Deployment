# AWS CodeDeploy Application Specification
# Version: 2.1 - Production-Ready & Hardened
version: 0.0
os: linux

# Define files to be deployed
files:
  - source: /
    destination: /var/www/html
    owner: root
    group: root
    mode: 755

# Set proper permissions for web content
permissions:
  - object: /var/www/html
    pattern: "**"
    owner: www-data
    group: www-data
    mode: 755
    type:
      - file
      - directory

  # Restrict permissions on sensitive configuration and shell files
  - object: /var/www/html
    pattern: "*.conf"
    owner: root
    group: root
    mode: 644
    type: file

  - object: /var/www/html
    pattern: "*.sh"
    owner: root
    group: root
    mode: 750
    type: file

# Deployment lifecycle hooks
hooks:
  # Gracefully stop running service before bundle extraction
  ApplicationStop:
    - location: scripts/stop_nginx.sh
      timeout: 60
      runas: root

  # Pre-deployment environment validation and backup
  BeforeInstall:
    - location: scripts/validate_environment.sh
      timeout: 300
      runas: root
    - location: scripts/backup_current_deployment.sh
      timeout: 120
      runas: root

  # Install Nginx and apply security configuration
  AfterInstall:
    - location: scripts/install_nginx.sh
      timeout: 300
      runas: root
    - location: scripts/apply_security_config.sh
      timeout: 120
      runas: root

  # Start Nginx service with health checks
  ApplicationStart:
    - location: scripts/start_nginx.sh
      timeout: 180
      runas: root

  # Post-deployment validation testing
  ValidateService:
    - location: scripts/validate_deployment.sh
      timeout: 120
      runas: root
