# AWS CodeBuild Build Specification
# Version: 2.1 - Modern, Reliable CI/CD Build & Validation
version: 0.2

env:
  variables:
    APP_ENV: "production"
    DEPLOYMENT_NAME: "AWS-DevOps-App"
  exported-variables:
    - BUILD_TIMESTAMP
    - COMMIT_HASH

phases:
  install:
    runtime-versions:
      nodejs: 20
      python: 3.11
    commands:
      - echo "=== CODEBUILD INSTALL PHASE STARTED ==="
      - echo "Build started on $(date -u) with Build ID $CODEBUILD_BUILD_ID"
      - export BUILD_TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
      - export COMMIT_HASH="${CODEBUILD_RESOLVED_SOURCE_VERSION:-manual-build}"
      
      # Install linting & security audit tools
      - |
        echo "Setting up validation and security scanning tools..."
        if command -v apt-get &>/dev/null; then
          apt-get update -y && apt-get install -y shellcheck || echo "ShellCheck install skipped"
        fi
        pip install --upgrade pip pyyaml || true

  pre_build:
    commands:
      - echo "=== CODEBUILD PRE-BUILD: LINT & VALIDATION ==="
      
      # 1. Validate required deployment manifests & files
      - |
        echo "Checking required files..."
        required_files=("appspec.yml" "index.html" "nginx-security.conf" "scripts/install_nginx.sh" "scripts/start_nginx.sh" "scripts/stop_nginx.sh" "scripts/validate_environment.sh" "scripts/validate_deployment.sh" "scripts/apply_security_config.sh" "scripts/backup_current_deployment.sh")
        for f in "${required_files[@]}"; do
          if [ -f "$f" ]; then
            echo "✅ Found $f"
          else
            echo "❌ Missing required file: $f"
            exit 1
          fi
        done

      # 2. Syntax check all shell scripts
      - |
        echo "Validating Bash scripts syntax..."
        for script in scripts/*.sh; do
          if [ -f "$script" ]; then
            bash -n "$script" || {
              echo "❌ Syntax error in $script"
              exit 1
            }
            echo "✅ Syntax valid: $script"
          fi
        done

      # 3. YAML syntax validation
      - |
        echo "Validating YAML manifests..."
        python3 -c "import yaml; yaml.safe_load(open('appspec.yml')); yaml.safe_load(open('buildspec.yml')); print('✅ YAML files are valid')" || {
          echo "❌ YAML syntax error"
          exit 1
        }

      # 4. Validate environment files
      - |
        echo "Validating environment files syntax..."
        for envfile in environments/*.env; do
          if [ -f "$envfile" ]; then
            bash -n "$envfile" || {
              echo "❌ Syntax error in $envfile"
              exit 1
            }
            echo "✅ Syntax valid: $envfile"
          fi
        done

      # 5. Security check for exposed secrets & private keys
      - |
        echo "Running security audit for secret leaks..."
        if grep -r -i -E "(AKIA[0-9A-Z]{16}|BEGIN PRIVATE KEY|aws_secret_access_key|password\s*=\s*['\"][^'\"]+['\"])" . --exclude-dir=".git" --exclude="buildspec.yml" --exclude="*.log"; then
          echo "⚠️ Warning: Potential sensitive credentials detected in source repository"
        else
          echo "✅ No exposed secrets detected in source scan"
        fi

  build:
    commands:
      - echo "=== CODEBUILD BUILD PHASE STARTED ==="
      
      # Generate dynamic build-info metadata
      - |
        echo "Generating build-info.json metadata..."
        cat > build-info.json << EOF
        {
          "application": "AWS-DevOps_Real-Time_Deployment",
          "build_id": "${CODEBUILD_BUILD_ID:-local}",
          "build_number": "${CODEBUILD_BUILD_NUMBER:-1}",
          "commit_hash": "${COMMIT_HASH}",
          "build_time": "${BUILD_TIMESTAMP}",
          "environment": "${APP_ENV}"
        }
        EOF
        cat build-info.json

      # Ensure executable permissions on all shell scripts for packaging
      - |
        echo "Setting executable permissions on scripts..."
        chmod +x scripts/*.sh

  post_build:
    commands:
      - echo "=== CODEBUILD POST-BUILD PHASE COMPLETED ==="
      - echo "Build completed successfully on $(date -u)"
      - echo "Artifacts prepared for AWS CodeDeploy deployment."

artifacts:
  files:
    - 'appspec.yml'
    - 'buildspec.yml'
    - 'build-info.json'
    - 'index.html'
    - 'nginx-security.conf'
    - 'scripts/**/*'
    - 'environments/**/*'
  discard-paths: no

cache:
  paths:
    - '/root/.cache/pip/**/*'
