    <style>
        /* CSS Reset and Base Styles */
        *, *::before, *::after {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Google Font with fallback */
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap');

        :root {
            --primary-gradient: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            --button-gradient: linear-gradient(90deg, #7b2ff7, #d527b7);
            --button-hover-gradient: linear-gradient(90deg, #d527b7, #7b2ff7);
            --text-primary: #ffffff;
            --text-secondary: rgba(255, 255, 255, 0.9);
            --container-bg: rgba(255, 255, 255, 0.12);
            --border-color: rgba(255, 255, 255, 0.2);
            --shadow-color: rgba(0, 0, 0, 0.3);
            --button-shadow: rgba(123, 47, 247, 0.4);
            --button-hover-shadow: rgba(123, 47, 247, 0.6);
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: var(--primary-gradient);
            color: var(--text-primary);
            text-align: center;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            line-height: 1.6;
            font-size: 16px;
        }

        .container {
            max-width: 650px;
            width: 90%;
            background: var(--container-bg);
            padding: 35px;
            border-radius: 15px;
            box-shadow: 0 10px 30px var(--shadow-color);
            backdrop-filter: blur(12px);
            animation: fadeIn 1.5s ease-in-out;
            border: 2px solid var(--border-color);
            margin: 20px;
            position: relative;
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .container {
                padding: 25px;
                margin: 10px;
                width: 95%;
            }
            
            h1 {
                font-size: 28px;
            }
            
            p {
                font-size: 16px;
            }
        }

        @media (max-width: 480px) {
            .container {
                padding: 20px;
                margin: 5px;
            }
            
            h1 {
                font-size: 24px;
            }
            
            p {
                font-size: 14px;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        h1 {
            font-size: clamp(24px, 5vw, 32px);
            font-weight: 700;
            margin-bottom: 1rem;
            color: var(--text-primary);
            line-height: 1.2;
        }

        p {
            font-size: clamp(14px, 2.5vw, 18px);
            margin-bottom: 1rem;
            opacity: 0.9;
        }

        .cta-button {
            display: inline-block;
            background: var(--button-gradient);
            color: var(--text-primary);
            text-decoration: none;
            font-weight: 600;
            padding: 12px 28px;
            border-radius: 30px;
            transition: all 0.3s ease-in-out;
            box-shadow: 0 4px 10px var(--button-shadow);
            cursor: pointer;
            border: 2px solid transparent;
            font-size: 16px;
            position: relative;
            overflow: hidden;
        }

        .cta-button:hover {
            background: var(--button-hover-gradient);
            transform: scale(1.07);
            box-shadow: 0 6px 15px var(--button-hover-shadow);
        }

        .cta-button:focus {
            outline: 3px solid rgba(123, 47, 247, 0.5);
            outline-offset: 2px;
            border-color: rgba(255, 255, 255, 0.3);
        }

        .cta-button:active {
            transform: scale(1.02);
        }

        /* Accessibility improvements */
        .visually-hidden {
            position: absolute;
            width: 1px;
            height: 1px;
            padding: 0;
            margin: -1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            border: 0;
        }

        /* Animation */
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* Skip link for accessibility */
        .skip-link {
            position: absolute;
            top: -40px;
            left: 6px;
            background: #000;
            color: #fff;
            padding: 8px;
            text-decoration: none;
            z-index: 1000;
            border-radius: 4px;
        }
        
        .skip-link:focus {
            top: 6px;
        }
    </style>
</head>
